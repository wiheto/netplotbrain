version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.13
    resource_class: medium
    environment:
      MPLBACKEND: Agg
    steps:
      - checkout

      - run:
          name: additional pip install
          no_output_timeout: 5m
          command: |
            pip install --upgrade pip
            pip install pytest pytest-mpl coverage pytest-cov coveralls
      - run:
          name: doc install
          no_output_timeout: 5m
          command: |
            pip install mkdocs-awesome-pages-plugin pheasant mkdocstrings mkdocs-material
      - run:
          name: install netplotbrain
          command: |
            pip install ./
      - run:
          name: Show test environment (in case local/CI baseline mismatch keeps happening)
          command: |
            python --version
            python -c "import matplotlib, numpy; from matplotlib import ft2font; print('Matplotlib:', matplotlib.__version__); print('NumPy:', numpy.__version__); print('backend:', matplotlib.get_backend()); print('FreeType:', ft2font.__freetype_version__)"
      - run:
          name: Run tests
          no_output_timeout: 15m
          command: |
            coverage run --source=netplotbrain -m pytest --mpl
      - run:
          name: Save Coverage Data
          command: |
            if [ -f .coverage ]; then
              mkdir -p coverage_data
              cp .coverage coverage_data/.coverage.serial
            else
              echo "No coverage data file found."
            fi
      - run:
          name: Show Coverage Data File
          command: |
            ls -lh coverage_data
            coverage report --data-file=coverage_data/.coverage.serial
      - store_artifacts:
          path: pytest_images/
          destination: pytest_images
      - run:
          name: Coveralls
          command: coveralls

workflows:
  sample:
    jobs:
      - build-and-test
