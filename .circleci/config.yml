version: 2.1

orbs:
  python: circleci/python@1.2
  coveralls: coveralls/coveralls@1.0.6

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.9
    resource_class: medium
    steps:
      - run:
          name: Checkout code
          no_output_timeout: 10m
          command: |
            git init .
            git remote add origin https://github.com/wiheto/netplotbrain.git
            git fetch --depth=1 origin "$CIRCLE_SHA1"
            git checkout FETCH_HEAD
      - python/install-packages:
          pkg-manager: pip
      - run:
          name: additional pip install
          no_output_timeout: 5m
          command: |
            pip install pytest pytest-mpl coverage pytest-cov coveralls
      - run:
          name: doc install
          no_output_timeout: 5m
          command: |
            pip install mkdocs-awesome-pages-plugin pheasant mkdocstrings mkdocs-material
      - run:
          name: install netplotbrain
          command: |
            pip install ./
      - run:
          name: Run tests
          no_output_timeout: 15m
          command: |
            coverage run --source=netplotbrain -m pytest --mpl
      - run:
          name: Save Coverage Data
          command: |
            if [ -f .coverage ]; then
              mkdir -p coverage_data
              cp .coverage coverage_data/.coverage.serial
            else
              echo "No coverage data file found."
            fi
      - run:
          name: Show Coverage Data File
          command: |
            ls -lh coverage_data
            coverage report --data-file=coverage_data/.coverage.serial
      - store_artifacts:
          path: pytest_images/
          destination: pytest_images
      - run:
          name: Coveralls
          command: coveralls

workflows:
  sample:
    jobs:
      - build-and-test
